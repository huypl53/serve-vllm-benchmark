# Benchmark Configuration

benchmark:
  # Warmup iterations (not counted in results)
  warmup_iterations: 2

  # Number of iterations per image
  num_iterations: 3

  # Generation parameters
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9

  # Timeout for single inference (seconds)
  inference_timeout: 120

  # Retry configuration
  max_retries: 3
  retry_delay_base: 2.0 # Exponential backoff base

  # Concurrent requests (1 = sequential, >1 = parallel batch processing)
  concurrency_level: 4

server:
  # Server startup timeout (seconds)
  startup_timeout: 300

  # Health check interval (seconds)
  health_check_interval: 5

  # Port mappings
  ports:
    vllm: 8000
    lmdeploy: 23333
    tgi: 8080
    tensorrt: 8001

gpu:
  # GPU monitoring interval (milliseconds)
  monitor_interval_ms: 100

  # Target GPU indices
  target_gpus: [0]

output:
  # Results directory
  results_dir: "./results"

  # Save model outputs for quality review
  save_model_outputs: true

  # Timestamp format for filenames
  timestamp_format: "%Y%m%d_%H%M%S"

prompts:
  # Default VQA prompt
  default: |
    Bạn là trợ lý mô tả ảnh. Trả lời ngắn gọn bằng tiếng Việt.
    Chỉ cung cấp 3 mục: Text, Objects, Actions.
    Text và Objects phải là danh sách để dễ tách dữ liệu. Actions mô tả hành động chính.
    Định dạng gợi ý (có thể giữ nguyên để dễ trích xuất):
    Text: [mục1, mục2]
    Objects: [mục1, mục2]
    Actions: mô tả ngắn
    Nếu không có, dùng [] cho danh sách.

  # Alternative prompts for different tasks
  alternatives:
